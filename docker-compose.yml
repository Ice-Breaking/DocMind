# DocMind 一键部署：docker compose up -d
# 需要先在项目根目录准备好 .env（参考 .env.example）
services:
  docmind:
    build: .
    image: docmind:latest
    ports:
      - "7860:7860"
    env_file:
      - .env                     # 百炼 API Key / Tavily Key 等（不进镜像、不进仓库）
    environment:
      - SEARXNG_URL=http://searxng:8080   # 容器网络内直连 SearXNG，覆盖 .env 中的地址
    volumes:
      # data/ = chat.db（用户/会话/反馈/文档ACL）+ cache.db（语义缓存）+
      #         向量索引缓存 + trace 日志 + docx 转 PDF/OCR 预览缓存
      # 必须挂载：否则容器删除后账号与全部会话历史丢失
      - docmind-data:/app/data
      - ./docs/knowledge:/app/docs/knowledge     # 知识库热更新：改文档重启容器即可
    depends_on:
      - searxng
    restart: unless-stopped

  # 自托管元搜索引擎：免费无限量，作为 Tavily 的降级兜底
  # 浏览器也可直接访问 http://localhost:8080 手动搜索
  searxng:
    image: searxng/searxng:latest
    ports:
      - "8080:8080"
    volumes:
      - ./searxng:/etc/searxng:rw
    environment:
      - SEARXNG_BASE_URL=http://localhost:8080/
    restart: unless-stopped

volumes:
  docmind-data:
