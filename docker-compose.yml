# DocMind 一键部署：docker compose up -d
# 需要先在项目根目录准备好 .env（参考 .env.example）
#
# 架构：nginx (port 80) → frontend 静态文件 + 反向代理到 docmind 后端
#   - frontend: React SPA，nginx 提供静态文件服务，同时代理 API 请求到后端
#   - docmind:  Gradio/FastAPI 后端，仅监听 127.0.0.1:7860（外部无法直接访问）
#   - searxng:  元搜索引擎，仅监听 127.0.0.1:8080（供 docmind 容器内通过 Docker 网络访问）
services:
  # 前端容器：nginx 静态服务 + API 反向代理（SSE 安全）
  frontend:
    build: ./web
    ports:
      - "80:80"
    depends_on:
      - docmind
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 256m
          cpus: "0.5"

  docmind:
    build: .
    image: docmind:latest
    ports:
      - "127.0.0.1:7860:7860"   # 仅本机调试用，正常流量由 nginx 代理
    env_file:
      - .env                     # 百炼 API Key / Tavily Key 等（不进镜像、不进仓库）
    environment:
      - SEARXNG_URL=http://searxng:8080   # 容器网络内直连 SearXNG，覆盖 .env 中的地址
      # 信任容器网络内 nginx 反代传来的 X-Forwarded-For（uvicorn proxy_headers），
      # 使 IP 维度防爆破/审计日志记录真实客户端 IP。
      # 收敛为 compose 固定子网（见文件底部 networks.default）：仅反代所在网段
      # 的 XFF 被信任，网段外直连方伪造 XFF 不生效（uvicorn 0.52+ 支持 CIDR）。
      # 实测教训：写 Docker 默认池 172.16.0.0/12 会失配——本机 Docker Desktop
      # 配置了自定义地址池，chat-1_default 实际为 192.168.97.0/24；失配时 XFF
      # 全部不被信任 → 审计退化为网关 IP、IP 维度防爆破误伤全部来源。
      # 换机部署若网段被占：同步修改此处与底部 networks.default.subnet
      - FORWARDED_ALLOW_IPS=192.168.97.0/24
    volumes:
      # data/ = chat.db（用户/会话/反馈/文档ACL）+ cache.db（语义缓存）+
      #         向量索引缓存 + trace 日志 + docx 转 PDF/OCR 预览缓存
      # 必须挂载：否则容器删除后账号与全部会话历史丢失
      - docmind-data:/app/data
      - ./docs/knowledge:/app/docs/knowledge     # 知识库热更新：改文档重启容器即可
    depends_on:
      - searxng
    restart: unless-stopped
    # 资源限额：防止失控任务（超大文档转码/索引）耗尽宿主资源
    deploy:
      resources:
        limits:
          memory: 4g
          cpus: "2.0"

  # 自托管元搜索引擎（联网搜索兜底）：免费无限量，作为 Tavily 的降级兜底
  # docmind 容器内通过 Docker 网络直连 http://searxng:8080
  # 本机调试可访问 http://localhost:8080
  searxng:
    image: searxng/searxng:latest
    ports:
      - "127.0.0.1:8080:8080"   # 仅本机调试用
    volumes:
      - ./searxng:/etc/searxng:rw
    environment:
      # 密钥缺失直接拒启（:?），杜绝空 secret 上线；.env 中生成：openssl rand -hex 32
      - SEARXNG_SECRET=${SEARXNG_SECRET:?请在 .env 设置 SEARXNG_SECRET（openssl rand -hex 32）}
      - SEARXNG_BASE_URL=http://localhost:8080/
    # 该镜像的 YAML 加载器不支持 !env 标签：启动前用 sed 将密钥写入
    # bind mount 的 settings.yml（占位符被真实值替换，仅存在于部署机本地）
    entrypoint: ["/bin/sh", "-c",
      'sed -i "s|^[[:space:]]*secret_key:.*|  secret_key: \"${SEARXNG_SECRET}\"|" /etc/searxng/settings.yml && exec /usr/local/searxng/entrypoint.sh']
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 512m
          cpus: "1.0"

volumes:
  docmind-data:

# 固定 compose 子网：与 docmind 的 FORWARDED_ALLOW_IPS 对齐；换机部署若该网段
# 被占用，需同步修改此处与 FORWARDED_ALLOW_IPS
networks:
  default:
    ipam:
      config:
        - subnet: 192.168.97.0/24
