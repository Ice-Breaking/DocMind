# SearXNG 配置（挂载到容器 /etc/searxng/settings.yml）
# 策略：保留默认引擎集，用 override 禁用国内不可达的、启用国内可通的
# （不用 remove 列表——引用默认集之外的引擎名会导致 KeyError 崩溃）
use_default_settings: true

server:
  # 本地演示用固定密钥；生产环境请换成随机值
  # 真实密钥由 compose entrypoint 启动时经 sed 注入（SEARXNG_SECRET，缺失拒启），
  # 仓库只保留占位符——固定 secret 可被攻击者伪造实例会话、绕过 bot 防护
  secret_key: "PLACEHOLDER-SET-BY-COMPOSE"
  # 关闭限流（供本机 Agent 调用；公网部署务必重新开启）
  # limiter 依赖 Redis 计数，本部署未引入 redis 服务；实例仅绑定宿主回环 +
  # 容器内网，暴露面可控故保持关闭。若公网部署：先补 redis 服务再开启
  limiter: false
  image_proxy: false

search:
  formats:
    - html
    - json    # DocMind web_search 依赖此格式

engines:
  # ---- 禁用：国内网络不可达的引擎 ----
  - name: brave
    disabled: true
  - name: duckduckgo
    disabled: true
  - name: startpage
    disabled: true
  - name: wikipedia
    disabled: true
  - name: wikidata
    disabled: true
  - name: google
    disabled: true
  - name: google_news
    disabled: true
  - name: google_cse
    disabled: true
  - name: qwant
    disabled: true
  - name: mojeek
    disabled: true
  - name: swisscows
    disabled: true
  # ---- 启用：国内可稳定访问的引擎 ----
  - name: bing
    disabled: false
    timeout: 10
  - name: bing_news
    disabled: false
    timeout: 10
  - name: bing_images
    disabled: true
  - name: bing_videos
    disabled: true
  - name: baidu
    disabled: false
    timeout: 10
  - name: quark
    disabled: false
    timeout: 10
