# Rate limiting zones
limit_req_zone $binary_remote_addr zone=api_limit:10m rate=30r/m;
limit_req_zone $binary_remote_addr zone=login_limit:10m rate=5r/m;
limit_req_zone $binary_remote_addr zone=pwd_change_limit:10m rate=5r/m;

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # 安全响应头四件套：SPA HTML 由本层直出（后端中间件覆盖不到静态入口），
    # always 确保错误响应同样携带。CSP 允许 inline style（antd cssinjs）、
    # blob/data 图片媒体与 worker（TTS 音频 / pdf.js）；dist 已核实无内联脚本
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self'; media-src 'self' blob:; worker-src 'self' blob:; frame-ancestors 'self'; form-action 'self'; base-uri 'self'" always;

    # Gzip compression
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml text/javascript image/svg+xml;
    gzip_min_length 1000;

    # 请求体上限（JSON 载荷均远小于此）
    client_max_body_size 1m;

    # React SPA — static files with history fallback
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Health check — no auth, no rate limit (Docker/monitoring probes)
    location = /health {
        proxy_pass http://docmind:7860;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # Static assets cache
    location /assets/ {
        expires 1y;
        # nginx 规则：location 内出现任意 add_header 即不再继承 server 级，
        # 安全头必须在此重复声明，否则静态资源响应裸奔（二轮回归实测缺失；
        # CSP 属文档级指令对 .js 资源无意义，故只补三件套）
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Cache-Control "public, immutable";
    }

    # Password change — stricter rate limit
    location = /api/change-password {
        limit_req zone=pwd_change_limit burst=2 nodelay;
        proxy_pass http://docmind:7860;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # API proxy (SSE-safe)
    location /api/ {
        limit_req zone=api_limit burst=10 nodelay;
        proxy_pass http://docmind:7860;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # SSE specific
        proxy_set_header Connection '';
        proxy_http_version 1.1;
        chunked_transfer_encoding off;
    }

    # 开放 API（API Key 鉴权，供企业系统集成）
    location /open/ {
        limit_req zone=api_limit burst=10 nodelay;
        proxy_pass http://docmind:7860;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Gradio auth endpoints
    location /login {
        limit_req zone=login_limit burst=3 nodelay;
        proxy_pass http://docmind:7860;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /logout {
        proxy_pass http://docmind:7860;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # File serving
    location /files/ {
        limit_req zone=api_limit burst=20 nodelay;
        proxy_pass http://docmind:7860;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # 注意：不再代理后端 /admin（旧版 HTML 看板已废弃），
    # 让 React SPA 的 /admin（会话审计）走 history fallback

    # Gradio internal paths (for legacy UI and WebSocket)
    location /gradio/ {
        proxy_pass http://docmind:7860;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /queue/ {
        proxy_pass http://docmind:7860;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
    }

    # Vendored assets
    location /mermaid.min.js {
        proxy_pass http://docmind:7860;
    }

    location /vendor/ {
        proxy_pass http://docmind:7860;
    }
}
